name: Build and Push Docker Image to ACR

# Defines when this workflow should run
on:
  # Run automatically when code is pushed to the main branch
  push:
    branches:
      - main
  # Also allow the workflow to be started manually from the GitHub Action page
  workflow_dispatch:

env:
  #Azure Container Registry resource name
  #Example: productmanagementacr2026
  ACR_NAME: ${{ vars.ACR_NAME }}
  # Complete ACR login server address
  # Example: productmanagementacr2026.azurecr.io
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  # Name of the Docker image repository inside ACR
  # Example: cityinfo-api
  ACR_IMAGE_NAME: cityinfo-api
  IMAGE_TAG: ${{ github.sha }}
  # Docker configurataion
  # Location of the Dockerfile in the GitHub repository
  DOCKERFILE_PATH: ./CityInfo.Api/Dockerfile
  #Folder containing the Dockerfile and all files needed to build the Docker image
  BUILD_CONTEXT: ./CityInfo.Api

jobs:
  build-and-test:
    # Run this job on a temporary GitHub-hosted Ubuntu machine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Azure login with federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.ACR_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.ACR_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image URI
        run: echo "Docker image pushed to ${{ env.ACR_LOGIN_SERVER }}/${{ env.ACR_IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
